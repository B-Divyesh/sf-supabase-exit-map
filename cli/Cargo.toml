[package]
name = "supabase-exit-map"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local dependency inventory and migration planner for Supabase projects"
readme = "../README.md"
keywords = ["supabase", "postgres", "migration", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.78"

[lib]
name = "supabase_exit_map"
path = "src/lib.rs"

[[bin]]
name = "supabase-exit-map"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.12"

